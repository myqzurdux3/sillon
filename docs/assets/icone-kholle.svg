<svg xmlns="http://www.w3.org/2000/svg" width="432" height="432" viewBox="0 0 108 108">
  <title>Icône Khôlle</title>
  <defs>
    <!-- Masque du lanceur Android : la zone reellement visible de l'icone adaptative. -->
    <clipPath id="mask">
      <rect x="18" y="18" width="72" height="72" rx="20" ry="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#mask)">
    <!-- Fond : nuit d'hiver -->
    <rect x="0" y="0" width="108" height="108" fill="#121C33"/>
    <!-- Lueur diagonale : phares dans la nuit -->
    <path d="M0,108 L108,0 L108,34 L34,108 Z" fill="#1B2A4A"/>

    <!-- Accent circonflexe : la signature du mot « khôlle » -->
    <path d="M46,30 L54,22 L62,30" fill="none" stroke="#F2A65A" stroke-width="4.5"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- La carte devient bulle de parole : une fiche qu'on entend au lieu de la lire -->
    <path d="M36,38 h36 a7,7 0 0 1 7,7 v20 a7,7 0 0 1 -7,7 h-22 l-11,10 v-10 h-3 a7,7 0 0 1 -7,-7 v-20 a7,7 0 0 1 7,-7 z"
          fill="#F4F0E6"/>

    <!-- Deux lignes de texte, suggerees -->
    <path d="M42,48 h24" stroke="#121C33" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M42,57 h15" stroke="#121C33" stroke-width="3.4" stroke-linecap="round"/>
  </g>
</svg>
